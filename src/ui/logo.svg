<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="#1e1e2e" />
  
  <!-- Routing Lines -->
  <path d="M200 200 L100 100" stroke="#00ffff" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 12" />
  <path d="M200 200 L300 100" stroke="#ff00ff" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 12" />
  <path d="M200 200 L200 320" stroke="#00ff99" stroke-width="12" stroke-linecap="round" stroke-dasharray="8 12" />

  <!-- End Nodes (API Providers) -->
  <circle cx="100" cy="100" r="24" fill="#00ffff" />
  <circle cx="300" cy="100" r="24" fill="#ff00ff" />
  <circle cx="200" cy="320" r="24" fill="#00ff99" />

  <!-- Center Node (Claude Hub) -->
  <circle cx="200" cy="200" r="48" fill="#d97757" />
  <circle cx="200" cy="200" r="16" fill="#1e1e2e" />
</svg>
